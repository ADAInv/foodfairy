# /etc/nginx/sites-available/food-fairy  (then symlink into sites-enabled)
# TLS: sudo certbot --nginx -d thefoodfairy.ca -d www.thefoodfairy.ca

server {
    listen 80;
    listen [::]:80;
    server_name thefoodfairy.ca www.thefoodfairy.ca;
    return 301 https://thefoodfairy.ca$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.thefoodfairy.ca;
    # ssl_certificate lines added by certbot
    return 301 https://thefoodfairy.ca$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thefoodfairy.ca;
    # ssl_certificate lines added by certbot

    # Photo uploads are capped at 15 MB by the app; leave a little headroom.
    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
